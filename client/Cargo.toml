[package]
name = "quickblog-client"
version = "0.1.0"
edition = "2021"

[dependencies]
base64 = "0.22"
gloo-net = { version = "0.7", features = ["http", "json"] }
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Clipboard", "HtmlInputElement", "HtmlTextAreaElement", "Navigator", "Storage", "Window"] }
yew = { version = "0.23", features = ["csr"] }
yew-router = "0.20"
